name: Create Version

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Reviewed integration branch to release into main
        required: true
        type: string
      increment:
        description: Version component to increment
        required: true
        default: build
        type: choice
        options:
          - build
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: briefcase-create-version
  cancel-in-progress: false

jobs:
  prepare:
    name: Merge branch and create version
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge reviewed branch and create tag
        id: release
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Git([Parameter(ValueFromRemainingArguments)][string[]]$Arguments) {
            & git @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "git failed with exit code $LASTEXITCODE`: git $($Arguments -join ' ')"
            }
          }

          $sourceBranch = $env:SOURCE_BRANCH.Trim()
          if ([string]::IsNullOrWhiteSpace($sourceBranch)) {
            throw 'A source branch is required.'
          }
          & git check-ref-format --branch $sourceBranch *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid source branch name: '$sourceBranch'."
          }
          if ($sourceBranch -eq 'main') {
            throw "Select a reviewed integration branch other than 'main'."
          }

          Invoke-Git config user.name 'github-actions[bot]'
          Invoke-Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Invoke-Git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          $sourceRef = 'refs/remotes/origin/release-source'
          Invoke-Git fetch --no-tags origin "+refs/heads/${sourceBranch}:$sourceRef"
          $sourceHead = (& git rev-parse $sourceRef).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve branch '$sourceBranch'." }

          $mainVersion = (& git show 'refs/remotes/origin/main:VERSION').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read VERSION from main.' }
          $sourceVersion = (& git show "${sourceRef}:VERSION").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read VERSION from '$sourceBranch'." }
          if ($sourceVersion -ne $mainVersion) {
            throw "Branch '$sourceBranch' contains VERSION '$sourceVersion', while main contains '$mainVersion'. Merge main into the branch before releasing."
          }

          $nextVersion = (& ./scripts/release/GetNextVersion.ps1 `
            -CurrentVersion $mainVersion `
            -Increment $env:VERSION_INCREMENT).Trim()
          $tag = "v$nextVersion"

          & git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) {
            throw "Tag '$tag' already exists."
          }
          if ($tagLookupExitCode -ne 2) {
            throw "Could not verify whether tag '$tag' already exists."
          }

          Invoke-Git switch --force-create release-main refs/remotes/origin/main
          Invoke-Git merge --no-ff --no-commit $sourceRef

          [IO.File]::WriteAllText(
            (Join-Path $PWD 'VERSION'),
            "$nextVersion`n",
            [Text.UTF8Encoding]::new($false))
          Invoke-Git add -- VERSION
          Invoke-Git commit -m "Release $tag from $sourceBranch"

          & git merge-base --is-ancestor $sourceHead HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit does not contain branch '$sourceBranch'."
          }

          $releaseCommit = (& git rev-parse HEAD).Trim()
          Invoke-Git @('tag', '-a', $tag, $releaseCommit, '-m', "Briefcase $nextVersion")

          # Updating main, the integration branch, and the tag atomically keeps
          # the next release on the new VERSION. If either branch changed after
          # it was fetched or any ref is denied, nothing is published.
          Invoke-Git push --atomic origin `
            'HEAD:refs/heads/main' `
            "HEAD:refs/heads/$sourceBranch" `
            "refs/tags/$tag"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    name: Publish client and server archives
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
