name: Create Version

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to merge into main
        required: true
        type: number
      increment:
        description: Version component to increment
        required: true
        default: build
        type: choice
        options:
          - build
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: briefcase-create-version
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and merge pull request
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate, version, and merge pull request
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Git([Parameter(ValueFromRemainingArguments)][string[]]$Arguments) {
            & git @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "git failed with exit code $LASTEXITCODE`: git $($Arguments -join ' ')"
            }
          }

          $pullRequestNumber = [uint32]::Parse($env:PR_NUMBER)
          $detailsJson = & gh pr view $pullRequestNumber `
            --json number,state,isDraft,baseRefName,headRefName,headRefOid,isCrossRepository,mergeable,title
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read pull request #$pullRequestNumber."
          }
          $pullRequest = $detailsJson | ConvertFrom-Json

          if ($pullRequest.state -ne 'OPEN') {
            throw "Pull request #$pullRequestNumber is not open."
          }
          if ($pullRequest.isDraft) {
            throw "Pull request #$pullRequestNumber is still a draft."
          }
          if ($pullRequest.baseRefName -ne 'main') {
            throw "Pull request #$pullRequestNumber targets '$($pullRequest.baseRefName)', not 'main'."
          }
          if ($pullRequest.isCrossRepository) {
            throw 'The release workflow can version only a pull request whose branch belongs to this repository.'
          }
          if ($pullRequest.mergeable -eq 'CONFLICTING') {
            throw "Pull request #$pullRequestNumber conflicts with main."
          }

          Invoke-Git config user.name 'github-actions[bot]'
          Invoke-Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Invoke-Git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          Invoke-Git fetch --no-tags origin "+refs/pull/$pullRequestNumber/head:refs/remotes/origin/release-pr/$pullRequestNumber"

          $pullRequestRef = "refs/remotes/origin/release-pr/$pullRequestNumber"
          $fetchedHead = (& git rev-parse $pullRequestRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $fetchedHead -ne $pullRequest.headRefOid) {
            throw 'The pull request changed while its release revision was being fetched. Run the workflow again.'
          }

          $mainVersion = (& git show 'refs/remotes/origin/main:VERSION').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read VERSION from main.' }
          $nextVersion = (& ./scripts/release/GetNextVersion.ps1 `
            -CurrentVersion $mainVersion `
            -Increment $env:VERSION_INCREMENT).Trim()
          $tag = "v$nextVersion"

          & git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) {
            throw "Tag '$tag' already exists."
          }
          if ($tagLookupExitCode -ne 2) {
            throw "Could not verify whether tag '$tag' already exists."
          }

          Invoke-Git switch --detach $pullRequestRef
          $pullRequestVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($pullRequestVersion -eq $mainVersion) {
            [IO.File]::WriteAllText(
              (Join-Path $PWD 'VERSION'),
              "$nextVersion`n",
              [Text.UTF8Encoding]::new($false))
            Invoke-Git add -- VERSION
            Invoke-Git commit -m "Release $tag"
            Invoke-Git push origin "HEAD:refs/heads/$($pullRequest.headRefName)"
          }
          elseif ($pullRequestVersion -ne $nextVersion) {
            throw "The pull request contains VERSION '$pullRequestVersion'; expected '$mainVersion' or prepared version '$nextVersion'."
          }

          $versionedHead = (& git rev-parse HEAD).Trim()
          Start-Sleep -Seconds 10
          $checkOutput = (& gh pr checks $pullRequestNumber `
            --required --watch --fail-fast 2>&1 | Out-String).Trim()
          $checkExitCode = $LASTEXITCODE
          if ($checkOutput) { Write-Host $checkOutput }
          if ($checkExitCode -ne 0 -and $checkOutput -notmatch 'no (required )?checks reported') {
            throw "Required checks did not pass for pull request #$pullRequestNumber."
          }

          & gh pr merge $pullRequestNumber --merge --match-head-commit $versionedHead
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub refused to merge pull request #$pullRequestNumber."
          }

          $mergeCommit = $null
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $mergeStatusJson = & gh pr view $pullRequestNumber --json state,mergeCommit
            if ($LASTEXITCODE -ne 0) { throw 'Could not read pull request merge status.' }
            $mergeStatus = $mergeStatusJson | ConvertFrom-Json
            if ($mergeStatus.state -eq 'MERGED' -and $null -ne $mergeStatus.mergeCommit) {
              $mergeCommit = $mergeStatus.mergeCommit.oid
              break
            }
            if ($mergeStatus.state -eq 'CLOSED') {
              throw "Pull request #$pullRequestNumber was closed without being merged."
            }
            Start-Sleep -Seconds 10
          }
          if ([string]::IsNullOrWhiteSpace($mergeCommit)) {
            throw "Timed out waiting for pull request #$pullRequestNumber to merge."
          }

          Invoke-Git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          $publishedVersion = (& git show "${mergeCommit}:VERSION").Trim()
          if ($LASTEXITCODE -ne 0 -or $publishedVersion -ne $nextVersion) {
            throw "Merged commit does not contain expected VERSION '$nextVersion'."
          }
          Invoke-Git tag -a $tag $mergeCommit -m "Briefcase $nextVersion"
          Invoke-Git push origin "refs/tags/$tag"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$nextVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    name: Publish client and server archives
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
