name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build portable client and server archives
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match VERSION '$version'. Expected '$expectedTag'."
          }
          "BRIEFCASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package Briefcase
        shell: pwsh
        run: ./scripts/release/PrepareRelease.ps1 -Configuration Release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath artifacts/release -Filter '*.zip' -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName })
          if ($archives.Count -ne 2) {
            throw "Expected exactly two archives, found $($archives.Count)."
          }

          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @archives --clobber
          }
          else {
            & gh release create $env:RELEASE_TAG @archives `
              --verify-tag `
              --generate-notes `
              --title "Briefcase $env:BRIEFCASE_VERSION"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
